<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mat. Puras">

<title>Matemáticas Puras</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#1e3a8a;--accent:#2563eb;--ok:#15803d;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.5}
header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:18px;padding:4px 8px;cursor:pointer}
main{padding:16px;max-width:640px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h2,h3{margin:6px 0}
.ltitle{font-size:20px;margin:8px 0 4px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:disabled{opacity:.55;cursor:not-allowed}
.card b{display:block;font-size:15px;margin-bottom:4px}
.card small{color:var(--muted);font-size:12px;line-height:1.3}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#dbeafe;color:var(--brand);margin-top:8px}
.tag.soon{background:#f3f4f6;color:var(--muted)}
.lvl{margin:18px 0 0;font-size:15px;color:var(--brand)}
.lesson{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.lesson small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.panel p{margin:8px 0}
.ex{border-top:1px solid var(--line);padding:10px 0}
.exo{border-top:1px solid var(--line);padding:12px 0}
.exo p{margin:0 0 6px}
.result{font-size:18px;font-weight:600;color:var(--ok);margin:4px 0 8px;line-height:1.5}
ol.steps{padding-left:20px;margin:8px 0 0}
ol.steps li{margin:8px 0;line-height:1.45;font-size:15px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f5f9;padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-word}
.err{color:#b91c1c;font-size:15px}
.hint{font-size:14px;color:var(--muted);margin:0}
label.toggle{display:flex;align-items:center;gap:8px;font-size:15px;margin:10px 0}
.btn{font:inherit;font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer;width:100%;margin-top:6px}
.btn.alt{background:#e5e7eb;color:var(--ink)}
.exo .btn{width:auto;padding:7px 12px;font-size:14px;margin-top:4px}
.ans{margin-top:6px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .btn{width:auto;flex:1;font-size:14px;margin-top:0}

/* Fracciones apiladas y potencias */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.2;font-size:.92em}
.frac>span{display:block;padding:0 4px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;width:100%;text-align:center}
.frac>span:last-child{text-align:center}

/* Editor visual */
.ed{min-height:68px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:22px;line-height:1.7;margin:10px 0;cursor:text;word-break:break-word}
.ed.act{border-color:var(--accent)}
.sl{display:inline-block;min-width:12px;min-height:1.2em;border-radius:6px;vertical-align:middle}
.sl:empty{background:#e0e7ff;min-width:20px}
.sl.act{outline:2px solid var(--accent);outline-offset:1px;background:#eff6ff}
.ed .frac .sl{display:block;min-width:28px;text-align:center}
sup.sl{font-size:.62em;vertical-align:super;line-height:1}

/* Teclado */
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button{font:inherit;font-size:18px;height:48px;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;color:var(--ink);cursor:pointer;padding:0}
.keys button.fn{background:#e0e7ff;font-size:13px}
.keys button.run{background:var(--accent);color:#fff;border-color:transparent;grid-column:span 2;font-size:16px}
/* ---- Diseño ordenado de lecciones ---- */
.seg{display:flex;background:#e9edf5;border-radius:12px;padding:4px;gap:4px;margin:6px 0 16px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;padding:9px 4px;border-radius:9px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;color:inherit;cursor:pointer}
.lesson:active{background:#f8fafc}
.lesson .num{flex:0 0 32px;height:32px;border-radius:50%;background:#eff6ff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.lesson .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.lesson .lt b{font-size:15px;line-height:1.3}
.lesson small{color:var(--muted);font-size:12px}
.lesson .chev{color:var(--muted);font-size:24px;line-height:1}
.bar{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.card-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-box p{margin:6px 0}
.ex-h{font-weight:700;font-size:13px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.ex-t{font-size:17px;font-weight:600;margin:4px 0}
.exo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{background:#eff6ff;color:var(--accent);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:700}
.check{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.exo-q{font-size:17px;margin:4px 0 10px}
.card-box.ok{border-color:#86efac;background:#f0fdf4}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.ltitle{font-size:21px;margin:10px 0 2px;line-height:1.3}
.mat{display:inline-flex;flex-direction:column;justify-content:center;vertical-align:middle;margin:0 6px;padding:4px 10px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:6px}
.mrow{display:flex;gap:14px;justify-content:center}
.mrow>span{min-width:26px;text-align:center;padding:3px 0}
</style>

<body>
<header>
  <button id="backBtn" hidden aria-label="Volver">←</button>
  <h1 id="hdrTitle">Matemáticas Puras</h1>
</header>
<main id="app"></main>

<script>
const TOPICS = [
  {id:'calc', name:'Calculadora', desc:'Escribe operaciones y ecuaciones con el teclado', ready:true},
  {id:'arit', name:'Aritmética', desc:'Fracciones, decimales y orden de operaciones', ready:true},
  {id:'alg',  name:'Álgebra', desc:'Expresiones, ecuaciones y cuadráticas', ready:true},
  {id:'geo',  name:'Geometría y trigonometría', desc:'Áreas, ángulos, funciones trigonométricas', stage:2},
  {id:'cal',  name:'Cálculo', desc:'Límites, derivadas e integrales', stage:2},
  {id:'prob', name:'Probabilidad y estadística', desc:'Conteo, distribuciones, pruebas', stage:3},
  {id:'lin',  name:'Álgebra lineal', desc:'Vectores, matrices, determinantes, valores propios', ready:true},
  {id:'abs',  name:'Álgebra abstracta', desc:'Grupos, anillos, cuerpos y homomorfismos', ready:true},
  {id:'disc', name:'Discretas y numéricas', desc:'Lógica, grafos, métodos numéricos', stage:4},
  {id:'adv',  name:'Avanzadas', desc:'Análisis, topología, categorías', stage:5}
];

const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const hdrTitle = document.getElementById('hdrTitle');
let showSteps = (() => { try { return localStorage.getItem('mp-steps') !== '0'; } catch(e) { return true; } })();

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------- Números racionales exactos ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
/* Fracción apilada, como en un libro de texto */
const stack = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const F = stack;
class R {
  constructor(n, d = 1) {
    if (d === 0) throw new Error('División entre cero');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    this.n = n / g; this.d = d / g;
  }
  add(o) { return new R(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new R(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new R(this.n * o.n, this.d * o.d); }
  div(o) { if (o.n === 0) throw new Error('División entre cero'); return new R(this.n * o.d, this.d * o.n); }
  isZero() { return this.n === 0; }
  val() { return this.n / this.d; }
  toString() {
    if (this.d === 1) return String(this.n);
    return `${this.n < 0 ? '−' : ''}${stack(Math.abs(this.n), this.d)}`;
  }
}
const c = (n, d = 1) => new R(n, d);
const dec = v => { const [a, b = ''] = v.split('.'); return new R(Number(a + b), 10 ** b.length); };
const round4 = v => parseFloat(v.toFixed(4)).toString();

/* ---------- Polinomios (lista de coeficientes, índice = potencia) ---------- */
function trim(r) { while (r.length > 1 && r[r.length - 1].isZero()) r.pop(); return r.length ? r : [c(0)]; }
const deg = p => p.length - 1;
function padd(p, q) {
  const n = Math.max(p.length, q.length), r = [];
  for (let i = 0; i < n; i++) r.push((p[i] || c(0)).add(q[i] || c(0)));
  return trim(r);
}
function pmul(p, q) {
  const r = Array.from({length: p.length + q.length - 1}, () => c(0));
  p.forEach((a, i) => q.forEach((b, j) => { r[i + j] = r[i + j].add(a.mul(b)); }));
  return trim(r);
}
const psub = (p, q) => padd(p, q.map(t => t.mul(c(-1))));

function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      const m = s.slice(i).match(/^(\d+\.\d+|\d+|\.\d+)/);
      if (!m) throw new Error(`Número no válido cerca de "${s.slice(i, i + 5)}"`);
      out.push({t: 'num', v: m[0]}); i += m[0].length; continue;
    }
    if (/[a-zA-Z]/.test(ch)) {
      if (ch !== 'x') throw new Error('Por ahora la única variable es x');
      out.push({t: 'x'}); i++; continue;
    }
    if ('+-*/^()='.includes(ch)) { out.push({t: ch}); i++; continue; }
    throw new Error(`Carácter no válido: "${ch}"`);
  }
  return out;
}

function parsePoly(str) {
  const toks = tokenize(str);
  let pos = 0;
  const peek = () => toks[pos];
  const eat = t => { const k = toks[pos]; if (!k || k.t !== t) return false; pos++; return true; };
  const startsAtom = () => { const k = peek(); return k && (k.t === 'num' || k.t === 'x' || k.t === '('); };
  function expr() {
    let v = term();
    for (;;) {
      if (eat('+')) v = padd(v, term());
      else if (eat('-')) v = psub(v, term());
      else break;
    }
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      if (eat('*')) v = pmul(v, unary());
      else if (eat('/')) {
        const d = unary();
        if (deg(d) > 0) throw new Error('Sólo se puede dividir entre números, no entre expresiones con x');
        v = v.map(t => t.div(d[0]));
      }
      else if (startsAtom()) v = pmul(v, unary());
      else break;
    }
    return v;
  }
  function unary() {
    if (eat('-')) return psub([c(0)], unary());
    if (eat('+')) return unary();
    return power();
  }
  function power() {
    let v = atom();
    if (eat('^')) {
      let ex;
      if (eat('(')) {
        ex = expr();
        if (!eat(')')) throw new Error('Falta cerrar un paréntesis en el exponente');
      } else {
        const k = peek();
        if (!k || k.t !== 'num' || !/^\d+$/.test(k.v)) throw new Error('El exponente debe ser un entero positivo');
        pos++;
        ex = [dec(k.v)];
      }
      const e = ex.length === 1 ? ex[0].val() : NaN;
      if (!Number.isInteger(e) || e < 0) throw new Error('El exponente debe ser un entero positivo');
      if (e > 50) throw new Error('El exponente es demasiado grande para esta versión');
      let r = [c(1)];
      for (let i = 0; i < e; i++) r = pmul(r, v);
      v = r;
    }
    return v;
  }
  function atom() {
    const k = peek();
    if (!k) throw new Error('La expresión está incompleta');
    if (k.t === 'num') { pos++; return [dec(k.v)]; }
    if (k.t === 'x') { pos++; return [c(0), c(1)]; }
    if (eat('(')) {
      const v = expr();
      if (!eat(')')) throw new Error('Falta cerrar un paréntesis');
      return v;
    }
    throw new Error('Revisa la expresión: falta un número, una x o un paréntesis');
  }
  const v = expr();
  if (pos < toks.length) throw new Error('Sobra texto en la expresión');
  return v;
}

/* ---------- Formato ---------- */
function showPoly(p) {
  const parts = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const t = p[i];
    if (t.isZero()) continue;
    const a = new R(Math.abs(t.n), t.d);
    let coef = a.toString();
    if (a.d !== 1) coef = `(${coef})`;
    if (a.n === 1 && a.d === 1 && i > 0) coef = '';
    const body = i === 0 ? coef : i === 1 ? coef + 'x' : coef + 'x²';
    parts.push({neg: t.n < 0, body});
  }
  if (!parts.length) return '0';
  return parts.map((p, k) => k === 0 ? (p.neg ? '−' : '') + p.body : (p.neg ? ' − ' : ' + ') + p.body).join('');
}
function fmtCoef(r) {
  if (r.d === 1 && r.n === 1) return '';
  if (r.d === 1 && r.n === -1) return '−';
  return r.d === 1 ? String(r.n) : `(${r})`;
}
const fmtDec = r => parseFloat(r.val().toFixed(6)).toString();
const isqrt = n => { let r = Math.floor(Math.sqrt(n)); while (r * r > n) r--; while ((r + 1) * (r + 1) <= n) r++; return r; };
function exactSqrt(r) {
  if (r.n < 0) return null;
  const sn = isqrt(r.n), sd = isqrt(r.d);
  return (sn * sn === r.n && sd * sd === r.d) ? new R(sn, sd) : null;
}
function evalPoly(p, x) {
  let s = c(0), pw = c(1);
  p.forEach(t => { s = s.add(t.mul(pw)); pw = pw.mul(x); });
  return s;
}

/* ---------- Operaciones con números ---------- */
function evalArit(text) {
  const p = parsePoly(text.replace(/×|·/g, '*').replace(/÷/g, '/'));
  if (deg(p) > 0) throw new Error('Aquí no se usa x. Para ecuaciones usa una igualdad con x.');
  const v = p[0];
  const lines = [`= ${v}`];
  if (v.d !== 1) lines.push(`Decimal: ${fmtDec(v)}`);
  if (v.d !== 1 && Math.abs(v.n) > v.d) {
    const w = Math.floor(Math.abs(v.n) / v.d), rem = Math.abs(v.n) % v.d;
    if (rem) lines.push(`Número mixto: ${v.n < 0 ? '−' : ''}${w} ${stack(rem, v.d)}`);
  }
  const steps = [
    'Primero se resuelven paréntesis y potencias, después multiplicaciones y divisiones, y al final sumas y restas.',
    `Se simplifica el resultado dividiendo numerador y denominador entre su máximo común divisor: <span class="mono">${v}</span>`
  ];
  return {lines, steps};
}

/* ---------- Solucionador de ecuaciones ---------- */
function solveEquation(raw) {
  const txt = raw.replace(/×|·/g, '*').replace(/÷/g, '/').trim();
  const sides = txt.split('=');
  if (sides.length > 2) throw new Error('Sólo puede haber un signo =');
  const steps = [];
  const poly = sides.length === 2 ? psub(parsePoly(sides[0]), parsePoly(sides[1])) : parsePoly(txt);
  steps.push(`Igualamos todo a cero: <span class="mono">${showPoly(poly)} = 0</span>`);
  const d = deg(poly);
  if (d > 2) throw new Error('Por ahora resuelvo ecuaciones de grado 1 y 2. Los grados superiores llegan en una etapa posterior.');
  const k = poly[0], b = poly[1] || c(0), a = poly[2] || c(0);

  if (d === 0) {
    return k.isZero()
      ? {lines: ['Cualquier número es solución'], steps}
      : {lines: ['No tiene solución'], steps: [...steps, `<span class="mono">${k} = 0</span> es falso`]};
  }

  if (d === 1) {
    const negK = k.mul(c(-1));
    const x = negK.div(b);
    steps.push(`Pasamos el término sin x al otro lado: <span class="mono">${fmtCoef(b)}x = ${negK}</span>`);
    steps.push(`Dividimos entre ${b.d === 1 ? b.n : `(${b})`}: <span class="mono">x = ${x}</span>`);
    steps.push(`Comprobación: <span class="mono">${b}·(${x}) + ${k} = ${b.mul(x).add(k)}</span> ✓`);
    const lines = [`x = ${x}`];
    if (x.d !== 1) lines.push(`Decimal: ${fmtDec(x)}`);
    return {lines, steps};
  }

  // Grado 2: a x² + b x + k = 0
  steps.push(`Identificamos: a = ${a}, b = ${b}, c = ${k}`);
  const disc = b.mul(b).sub(c(4).mul(a).mul(k));
  steps.push(`Discriminante: Δ = b² − 4ac = <span class="mono">(${b})² − 4·(${a})·(${k}) = ${disc}</span>`);

  if (disc.n < 0) {
    const re = -b.val() / (2 * a.val());
    const im = Math.sqrt(-disc.val()) / Math.abs(2 * a.val());
    steps.push('Como Δ es negativo, no hay raíces reales.');
    return {lines: ['No tiene soluciones reales', `Complejas: x ≈ ${round4(re)} ± ${round4(im)}i`], steps};
  }

  const twoA = a.mul(c(2));
  const nb = b.mul(c(-1));
  const s = exactSqrt(disc);
  steps.push(`Fórmula general: <span class="mono">x = ${stack('−b ± √Δ', '2a')}</span>`);

  if (s) {
    steps.push(`√Δ = <span class="mono">${s}</span>`);
    steps.push(`Sustituimos: <span class="mono">x = ${stack(`${nb} ± ${s}`, `${twoA}`)}</span>`);
    const r1 = nb.add(s).div(twoA);
    const r2 = nb.sub(s).div(twoA);
    steps.push(`Comprobación con x = ${r1}: <span class="mono">${showPoly(poly)} → ${evalPoly(poly, r1)}</span> ✓`);
    if (disc.isZero()) return {lines: [`Solución doble: x = ${r1}`], steps};
    const lines = [`x₁ = ${r1}`, `x₂ = ${r2}`];
    if (r1.d !== 1 || r2.d !== 1) lines.push(`Decimales: ${fmtDec(r1)} y ${fmtDec(r2)}`);
    return {lines, steps};
  }

  const sq = Math.sqrt(disc.val());
  const nbv = nb.val(), tv = twoA.val();
  steps.push(`Δ no es cuadrado perfecto, así que usamos decimales: √Δ ≈ ${round4(sq)}`);
  steps.push(`Sustituimos: <span class="mono">x = ${stack(`${round4(nbv)} ± ${round4(sq)}`, round4(tv))}</span>`);
  return {
    lines: [`x₁ ≈ ${round4((nbv + sq) / tv)}`, `x₂ ≈ ${round4((nbv - sq) / tv)}`],
    steps
  };
}

/* ---------- Editor visual con teclado ---------- */
let edSeq = 0;
function makeEditor(host, onRun) {
  const slots = {};
  const mk = (owner, container) => { const s = {id: ++edSeq, items: [], owner, container}; slots[s.id] = s; return s; };
  const root = mk(null, null);
  let active = root;
  const MAP = {'×': '*', '−': '-', '÷': '/'};

  // Convierte el contenido en texto para el motor matemático
  const ser = s => s.items.map(it => {
    if (it.t === 'c') return MAP[it.v] || it.v;
    if (it.t === 'frac') return `((${ser(it.n)})/(${ser(it.d)}))`;
    return `^(${ser(it.s)})`;
  }).join('');

  // Muestra el contenido como en papel
  const show = s => s.items.map(it => {
    if (it.t === 'c') return esc(it.v);
    if (it.t === 'frac') return `<span class="frac"><span class="sl${active === it.n ? ' act' : ''}" data-sid="${it.n.id}">${show(it.n)}</span><span class="sl${active === it.d ? ' act' : ''}" data-sid="${it.d.id}">${show(it.d)}</span></span>`;
    return `<sup class="sl${active === it.s ? ' act' : ''}" data-sid="${it.s.id}">${show(it.s)}</sup>`;
  }).join('');

  const disp = document.createElement('div');
  disp.className = 'ed';
  disp.dataset.sid = root.id;
  const draw = () => {
    disp.innerHTML = show(root) || '<span class="hint">Usa el teclado para escribir</span>';
    disp.classList.toggle('act', active === root);
  };

  function backspace() {
    if (active.items.length) { active.items.pop(); return; }
    if (!active.container) return;
    const cont = active.container, owner = active.owner;
    const sibs = cont.t === 'frac' ? [cont.n, cont.d] : [cont.s];
    if (sibs.every(s => !s.items.length)) {
      owner.items.splice(owner.items.indexOf(cont), 1);
      active = owner;
    }
  }

  const KEYS = [
    ['7'], ['8'], ['9'], ['÷'], ['('],
    ['4'], ['5'], ['6'], ['×'], [')'],
    ['1'], ['2'], ['3'], ['−'], ['='],
    ['0'], ['.'], ['x'], ['+'], ['Fracción', 'frac'],
    ['Potencia', 'pow'], ['⌫', 'bk'], ['Limpiar', 'clr'], ['Calcular', 'run']
  ];
  const kb = document.createElement('div');
  kb.className = 'keys';
  kb.innerHTML = KEYS.map(([label, action]) => {
    const cls = action === 'run' ? 'run' : action ? 'fn' : '';
    return `<button class="${cls}" data-k="${action || label}">${label}</button>`;
  }).join('');

  kb.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const k = b.dataset.k;
    if (k === 'frac') {
      const it = {t: 'frac'};
      it.n = mk(active, it); it.d = mk(active, it);
      active.items.push(it); active = it.n;
    } else if (k === 'pow') {
      const it = {t: 'sup'};
      it.s = mk(active, it);
      active.items.push(it); active = it.s;
    } else if (k === 'bk') {
      backspace();
    } else if (k === 'clr') {
      root.items = []; active = root;
    } else if (k === 'run') {
      draw();
      onRun(ser(root));
      return;
    } else {
      active.items.push({t: 'c', v: k});
    }
    draw();
  });

  // Tocar un espacio del editor selecciona ese lugar para escribir
  disp.addEventListener('click', e => {
    const el = e.target.closest('[data-sid]');
    if (el) { active = slots[el.dataset.sid]; draw(); }
  });

  host.innerHTML = '';
  host.append(disp, kb);
  draw();
}

    {id:'primos-divisibilidad', level:'Intermedio', title:'Números primos y divisibilidad',
     theory:[
       `Un número <b>primo</b> sólo es divisible entre 1 y entre sí mismo. El 1 no es primo.`,
       `Criterios rápidos: es divisible entre 2 si termina en par; entre 3 si la suma de sus cifras es múltiplo de 3; entre 5 si termina en 0 o 5; entre 9 si la suma de sus cifras es múltiplo de 9; entre 10 si termina en 0.`
     ],
     examples:[
       {t: '¿91 es primo?', steps:['91 no es par, la suma de cifras es 10, y no termina en 0 o 5.', 'Probando 7: 7 × 13 = 91. Entonces 91 no es primo.']}
     ],
     exercises:[
       {q: '¿97 es primo?', a: 'Sí', s:'No es divisible entre 2, 3, 5 ni 7 (7 × 14 = 98).'},
       {q: 'Descomposición de 84 en factores primos', a: '2² × 3 × 7', s:'84 = 4 × 21.'},
       {q: 'Divisibilidad de 234 entre 2, 3, 5, 9 y 10', a: 'Sí entre 2, 3 y 9; no entre 5 ni 10', s:'Suma de cifras: 9.'}
     ]},

    {id:'notacion-cientifica', level:'Intermedio', title:'Notación científica',
     theory:[
       `La notación científica escribe un número como a × 10ⁿ, con 1 ≤ a < 10. El exponente n indica cuántos lugares se mueve el punto decimal: positivo si el número es grande, negativo si es pequeño.`
     ],
     examples:[
       {t: '45 000', steps:['Mueves el punto 4 lugares a la izquierda: 4.5.', 'Resultado: 4.5 × 10⁴.']},
       {t: '0.0032', steps:['Mueves el punto 3 lugares a la derecha: 3.2.', 'Resultado: 3.2 × 10⁻³.']}
     ],
     exercises:[
       {q: '720 000', a: '7.2 × 10⁵'},
       {q: '0.00085', a: '8.5 × 10⁻⁴'},
       {q: '(2 × 10³) × (3 × 10⁴)', a: '6 × 10⁷', s:'Multiplicas los números (6) y sumas los exponentes (3 + 4 = 7).'}
     ]},

    {id:'raices', level:'Avanzado', title:'Raíces y radicales',
     theory:[
       `Propiedades: √(a × b) = √a × √b, y √(a/b) = √a / √b.`,
       `Para simplificar, saca los factores cuadrados perfectos. Para <b>racionalizar</b> un denominador, multiplicas arriba y abajo por la raíz del denominador.`
     ],
     examples:[
       {t: '√18', steps:['18 = 9 × 2, y √9 = 3.', 'Resultado: 3√2.']},
       {t: `${F(2,'√5')}`, steps:[`Racionalizas: multiplicas arriba y abajo por √5: ${F('2√5','5')}.`]}
     ],
     exercises:[
       {q: '√50', a: '5√2'},
       {q: '√72', a: '6√2', s:'72 = 36 × 2.'},
       {q: '√3 × √12', a: '6', s:'√36 = 6.'},
       {q: `${F(1,'√2')}`, a: `${F('√2',2)}`, s:'Multiplica arriba y abajo por √2.'}
     ]},

    {id:'decimales-operaciones', level:'Básico', title:'Operaciones con decimales',
     theory:[
       `<b>Suma y resta:</b> alinea los puntos decimales y opera como con enteros. <b>Multiplicación:</b> multiplica como enteros y cuenta los decimales de ambos factores; el resultado tiene esa cantidad de decimales. <b>División:</b> mueve el punto del divisor a la derecha hasta que sea entero, y haz lo mismo con el dividendo.`
     ],
     examples:[
       {t: '2.5 + 1.75', steps:['Alineas los puntos: 2.50 + 1.75.', 'Sumas: 4.25.']},
       {t: '0.4 × 0.3', steps:['Multiplicas 4 × 3 = 12.', 'Hay 1 + 1 = 2 decimales: 0.12.']},
       {t: '6.3 ÷ 0.7', steps:['Multiplicas divisor y dividendo por 10: 63 ÷ 7 = 9.']}
     ],
     exercises:[
       {q: '3.6 + 2.15', a: '5.75'},
       {q: '1.2 × 0.5', a: '0.6', s:'12 × 5 = 60, con 2 decimales: 0.60.'},
       {q: '4.8 ÷ 0.6', a: '8', s:'48 ÷ 6 = 8.'},
       {q: '10 − 0.37', a: '9.63'}
     ]},

    {id:'congruencias', level:'Avanzado', title:'Congruencias (aritmética modular)',
     theory:[
       `Decimos que a es congruente con b módulo n, y escribimos a ≡ b (mod n), si n divide a − b. Equivale a decir que a y b tienen el mismo residuo al dividir entre n.`,
       `Truco: el residuo de una suma o producto se puede calcular reduciendo cada factor antes de operar.`
     ],
     examples:[
       {t: '17 ≡ ? (mod 5)', steps:['17 ÷ 5 = 3 con residuo 2.', '17 ≡ 2 (mod 5).']},
       {t: '(7 + 9) mod 4', steps:['Reduces cada número: 7 mod 4 = 3 y 9 mod 4 = 1.', '3 + 1 = 4, y 4 mod 4 = 0.']}
     ],
     exercises:[
       {q: '29 mod 6', a: '5'},
       {q: '¿45 ≡ ? (mod 9)?', a: '0', s:'45 = 5 × 9.'},
       {q: '2³ mod 5', a: '3', s:'8 mod 5 = 3.'},
       {q: '¿Es 14 ≡ 2 (mod 6)?', a: 'Sí', s:'14 − 2 = 12, y 6 divide a 12.'}
     ]},

    {id:'criptografia-basica', level:'Avanzado', title:'Criptografía básica con aritmética modular',
     theory:[
       `La criptografía usa aritmética modular para cifrar mensajes. Un ejemplo clásico es el <b>cifrado César</b>: a cada letra le sumas una clave k y tomas el residuo módulo 26 (el alfabeto tiene 26 letras, con A = 0, B = 1… Z = 25).`,
       `Para descifrar, restas la clave y tomas el residuo otra vez.`
     ],
     examples:[
       {t: 'Cifra la letra A con clave 3', steps:['A = 0. Sumas 3: 0 + 3 = 3.', 'La letra 3 es D. Resultado: D.']},
       {t: 'Cifra la letra Z con clave 1', steps:['Z = 25. Sumas 1: 26.', '26 mod 26 = 0, que es A. Resultado: A.']}
     ],
     exercises:[
       {q: 'Cifra HOLA con clave 3', a: 'KROD', s:'H→K, O→R, L→O, A→D.'},
       {q: 'Cifra MATE con clave 5', a: 'RFYJ', s:'M(12)+5=17=R, A(0)+5=F, T(19)+5=24=Y, E(4)+5=9=J.'},
       {q: 'Descifra la letra D con clave 3', a: 'A', s:'D(3) − 3 = 0 = A.'}
     ]}
  ],

  alg: [
    {id:'expresiones', level:'Básico', title:'Expresiones y términos semejantes',
     theory:[
       `Una <b>expresión algebraica</b> mezcla números y letras, por ejemplo 3x + 5.`,
       `Sólo puedes sumar o restar términos <b>semejantes</b>: los que tienen la misma letra con el mismo exponente.`
     ],
     examples:[
       {t: '3x + 5x − 2', steps:['Términos con x: 3x + 5x = 8x.', 'El −2 no tiene x, se queda igual.', 'Resultado: 8x − 2.']},
       {t: '4x² + x² − 3x + 7x', steps:['Términos con x²: 4x² + x² = 5x².', 'Términos con x: −3x + 7x = 4x.', 'Resultado: 5x² + 4x.']}
     ],
     exercises:[
       {q: '9x − 3x', a: '6x'},
       {q: 'x² + 3x²', a: '4x²'},
       {q: '2x + 3 − x + 1', a: 'x + 4', s:'x con x: 2x − x = x. Números: 3 + 1 = 4.'}
     ]},

    {id:'ec-un-paso', level:'Básico', title:'Ecuaciones de un paso',
     theory:[
       `Una <b>ecuación</b> es una igualdad con una incógnita (la x). Resolverla es encontrar el valor de x que la cumple.`,
       `Lo que haces a un lado, lo haces también al otro: si sumas, restas; si multiplicas, divides.`
     ],
     examples:[
       {t: 'x + 5 = 12', steps:['Restas 5 en ambos lados: x = 12 − 5.', 'x = 7.', 'Comprobación: 7 + 5 = 12 ✓.']},
       {t: '3x = 18', steps:['Divides ambos lados entre 3: x = 18 ÷ 3 = 6.']}
     ],
     exercises:[
       {q: 'x − 9 = 4', a: 'x = 13'},
       {q: '4x = 20', a: 'x = 5'},
       {q: 'x ÷ 3 = 7', a: 'x = 21', s:'Multiplicas ambos lados por 3.'}
     ]},

    {id:'ec-dos-pasos', level:'Básico', title:'Ecuaciones de dos pasos',
     theory:[
       `Primero quitas la suma o la resta; después divides entre el número que acompaña a x.`
     ],
     examples:[
       {t: '2x + 3 = 7', steps:['Restas 3: 2x = 4.', 'Divides entre 2: x = 2.']},
       {t: '5 − x = 9', steps:['Restas 5: −x = 4.', 'Multiplicas por −1: x = −4.']}
     ],
     exercises:[
       {q: '3x − 5 = 10', a: 'x = 5'},
       {q: '5x + 2 = −8', a: 'x = −2', s:'5x = −10, luego x = −2.'},
       {q: '4 − x = 9', a: 'x = −5'}
     ]},

    {id:'ec-parentesis', level:'Intermedio', title:'Ecuaciones con paréntesis',
     theory:[
       `Primero quita los paréntesis con la <b>propiedad distributiva</b>: a(b + c) = ab + ac.`,
       `Después junta las x de un lado y los números del otro.`
     ],
     examples:[
       {t: '3(x − 2) = 2x + 1', steps:['Distribuyes: 3x − 6 = 2x + 1.', 'Pasas 2x a la izquierda y −6 a la derecha: x = 1 + 6.', 'x = 7.']}
     ],
     exercises:[
       {q: '2(x + 4) = 10', a: 'x = 1', s:'2x + 8 = 10, entonces 2x = 2 y x = 1.'},
       {q: '5(x − 1) = 3x + 3', a: 'x = 4', s:'5x − 5 = 3x + 3, entonces 2x = 8.'},
       {q: '4(2x − 1) = 3(x + 2)', a: 'x = 2', s:'8x − 4 = 3x + 6, entonces 5x = 10.'}
     ]},

    {id:'ec-fracciones', level:'Intermedio', title:'Ecuaciones con fracciones',
     theory:[
       `Para quitar las fracciones, multiplica toda la ecuación por el mínimo común múltiplo (mcm) de los denominadores.`
     ],
     examples:[
       {t: `${F('x',2)} + ${F('x',3)} = 5`, steps:['mcm(2, 3) = 6. Multiplicas todo por 6: 3x + 2x = 30.', '5x = 30, entonces x = 6.']}
     ],
     exercises:[
       {q: `${F('x',2)} − 1 = 3`, a: 'x = 8', s:`Sumas 1: ${F('x',2)} = 4, entonces x = 8.`},
       {q: `${F('x',3)} + ${F(1,2)} = 1`, a: `x = ${F(3,2)}`, s:`Con mcm 6: 2x + 3 = 6, entonces 2x = 3.`},
       {q: `${F('2x',5)} = 4`, a: 'x = 10', s:'Multiplicas por 5: 2x = 20.'}
     ]},

    {id:'cuadr-factor', level:'Avanzado', title:'Cuadráticas por factorización',
     theory:[
       `Una ecuación cuadrática tiene la forma ax² + bx + c = 0.`,
       `Si la puedes escribir como producto de dos factores igualado a cero, cada factor puede valer cero: (x − p)(x − q) = 0 da x = p o x = q.`
     ],
     examples:[
       {t: 'x² − 5x + 6 = 0', steps:['Buscas dos números que sumen −5 y multipliquen 6: −2 y −3.', '(x − 2)(x − 3) = 0.', 'x − 2 = 0 da x = 2; x − 3 = 0 da x = 3.']}
     ],
     exercises:[
       {q: 'x² − 9 = 0', a: 'x = 3 o x = −3', s:'(x − 3)(x + 3) = 0, diferencia de cuadrados.'},
       {q: 'x² + x − 6 = 0', a: 'x = 2 o x = −3', s:'(x + 3)(x − 2) = 0.'},
       {q: 'x² − 4x = 0', a: 'x = 0 o x = 4', s:'x(x − 4) = 0.'}
     ]},

    {id:'formula-general', level:'Avanzado', title:'La fórmula general',
     theory:[
       `Cuando no se factoriza fácil, usas la fórmula general: x = ${F('−b ± √(b² − 4ac)','2a')}.`,
       `El discriminante Δ = b² − 4ac dice cuántas soluciones reales hay: Δ > 0 da dos soluciones; Δ = 0 da una solución doble; Δ < 0 no da soluciones reales.`
     ],
     examples:[
       {t: '3x² − 5x + 2 = 0', steps:['a = 3, b = −5, c = 2.', 'Δ = (−5)² − 4·3·2 = 25 − 24 = 1.', `x = ${F('5 ± √1','6')} = ${F('5 ± 1','6')}.`, `x₁ = ${F(6,6)} = 1 y x₂ = ${F(4,6)} = ${F(2,3)}.`]}
     ],
     exercises:[
       {q: 'x² − 2x − 3 = 0', a: 'x = 3 o x = −1', s:'Δ = 4 + 12 = 16; x = (2 ± 4) / 2.'},
       {q: '2x² + 3x − 2 = 0', a: `x = ${F(1,2)} o x = −2`, s:'Δ = 9 + 16 = 25; x = (−3 ± 5) / 4.'},
       {q: 'x² + 4 = 0', a: 'No tiene soluciones reales', s:'Δ = −16 < 0.'}
     ]},

    {id:'practica-alg-basica', level:'Básico', title:'Práctica básica: ecuaciones con truco',
     theory:[
       `Para resolver, junta las x de un lado y los números del otro. El truco de los casos raros: si al simplificar queda algo verdadero como 3 = 3, la ecuación vale para cualquier número.`
     ],
     examples:[
       {t: '4x + 2 = 2x + 10', steps:['Pasas 2x a la izquierda: 2x + 2 = 10.', 'Pasas el 2: 2x = 8, entonces x = 4.']},
       {t: `x − (x − 3) = 3`, steps:['Quitas el paréntesis con cuidado de signo: x − x + 3 = 3.', 'Queda 3 = 3: es verdadero para cualquier x.']}
     ],
     exercises:[
       {q: '4x + 2 = 2x + 10', a: 'x = 4'},
       {q: '3(x + 2) = 15', a: 'x = 3', s:'Divides entre 3 antes o distribuyes: 3x + 6 = 15.'},
       {q: `${F('x',4)} + 1 = 3`, a: 'x = 8', s:`Restas 1: ${F('x',4)} = 2; multiplicas por 4.`},
       {q: '−x = 5', a: 'x = −5', s:'Truco: el signo menos delante de x se quita multiplicando por −1.'},
       {q: '2x − 7 = x + 1', a: 'x = 8'},
       {q: '5 − 2x = 1', a: 'x = 2', s:'−2x = −4, entonces x = 2.'},
       {q: 'x − (x − 3) = 3', a: 'Cualquier número es solución', s:'Queda 3 = 3, siempre verdadero.'}
     ]},

    {id:'practica-alg-intermedia', level:'Intermedio', title:'Práctica intermedia: casos especiales y fracciones',
     theory:[
       `Aquí aparecen tres casos: <b>sin solución</b> (queda algo falso, como 6 = 4), <b>cualquier número</b> (queda algo verdadero) y ecuaciones con fracciones, donde conviene multiplicar en cruz o por el mcm.`
     ],
     examples:[
       {t: '2(x − 3) = 2x + 4', steps:['Distribuyes: 2x − 6 = 2x + 4.', 'Restas 2x en ambos lados: −6 = 4.', 'Es falso: la ecuación no tiene solución.']}
     ],
     exercises:[
       {q: '2(x − 3) = 2x + 4', a: 'No tiene solución', s:'Queda −6 = 4, falso.'},
       {q: '3x + 2(x − 1) = 12', a: `x = ${F(14,5)}`, s:'5x − 2 = 12, entonces 5x = 14.'},
       {q: '−(x − 3) = 2x + 6', a: 'x = −1', s:'Truco: el signo menos afecta a todo el paréntesis: −x + 3 = 2x + 6.'},
       {q: `${F('x',3)} − ${F('x',4)} = 2`, a: 'x = 24', s:`Con mcm 12: 4x − 3x = 24.`},
       {q: '0.5x + 1.5 = 4', a: 'x = 5', s:'0.5x = 2.5, entonces x = 5.'},
       {q: `${F('x+1',2)} = ${F('x−1',3)}`, a: 'x = −5', s:'Multiplicas en cruz: 3(x + 1) = 2(x − 1), entonces 3x + 3 = 2x − 2.'},
       {q: '2x + 3 = 2(x + 1) + 1', a: 'Cualquier número es solución', s:'Queda 2x + 3 = 2x + 3, siempre verdadero.'}
     ]},

    {id:'practica-alg-avanzada', level:'Avanzado', title:'Práctica avanzada: cuadráticas con truco',
     theory:[
       `Truco: si no hay término lineal, despeja x² directo y saca raíz (con ±). Si hay x en un factor común, sácala antes de todo. Si la ecuación no está igualada a cero, pásalo todo a un lado primero.`
     ],
     examples:[
       {t: 'x(x + 3) = 4', steps:['Quitas paréntesis: x² + 3x = 4.', 'Pasas el 4: x² + 3x − 4 = 0.', '(x + 4)(x − 1) = 0, entonces x = −4 o x = 1.']}
     ],
     exercises:[
       {q: 'x² = 16', a: 'x = 4 o x = −4', s:'Truco: al sacar raíz de un cuadrado hay dos signos.'},
       {q: 'x² − x = 0', a: 'x = 0 o x = 1', s:'x(x − 1) = 0.'},
       {q: '2x² − 8 = 0', a: 'x = 2 o x = −2', s:'x² = 4.'},
       {q: 'x² + 2x + 1 = 0', a: 'x = −1 (solución doble)', s:'(x + 1)² = 0.'},
       {q: '2x² − x − 1 = 0', a: `x = 1 o x = ${F('−1','2')}`, s:'(2x + 1)(x − 1) = 0.'},
       {q: 'x² + 2x + 5 = 0', a: 'No tiene soluciones reales', s:'Δ = 4 − 20 = −16 < 0.'},
       {q: 'x(x + 3) = 4', a: 'x = 1 o x = −4', s:'Pasa todo a un lado: x² + 3x − 4 = 0.'}
     ]},

    {id:'productos-notables', level:'Intermedio', title:'Productos notables',
     theory:[
       `Son productos que se repiten mucho, así que conviene memorizarlos:`,
       `(a + b)² = a² + 2ab + b² &nbsp;·&nbsp; (a − b)² = a² − 2ab + b² &nbsp;·&nbsp; (a + b)(a − b) = a² − b²`
     ],
     examples:[
       {t: '(x + 3)²', steps:['a = x, b = 3.', 'a² = x², 2ab = 6x, b² = 9.', 'Resultado: x² + 6x + 9.']},
       {t: '(2x − 5)(2x + 5)', steps:['Es la suma por diferencia: a² − b² con a = 2x, b = 5.', 'Resultado: 4x² − 25.']}
     ],
     exercises:[
       {q: '(x + 4)²', a: 'x² + 8x + 16'},
       {q: '(3x − 1)²', a: '9x² − 6x + 1', s:'El término del medio es 2 · 3x · (−1) = −6x.'},
       {q: '(x − 7)(x + 7)', a: 'x² − 49'}
     ]},

    {id:'factorizacion', level:'Intermedio', title:'Factorización',
     theory:[
       `Factorizar es escribir una expresión como producto. Primero busca un <b>factor común</b>; después revisa si es <b>diferencia de cuadrados</b> (a² − b² = (a − b)(a + b)) o un <b>trinomio</b> x² + bx + c que se pueda separar en dos binomios.`
     ],
     examples:[
       {t: '6x² + 9x', steps:['Factor común: 3x.', 'Queda 3x(2x + 3).']},
       {t: 'x² − 16', steps:['Diferencia de cuadrados: x² − 4².', 'Queda (x − 4)(x + 4).']}
     ],
     exercises:[
       {q: '4x² − 8x', a: '4x(x − 2)'},
       {q: '9x² − 25', a: '(3x − 5)(3x + 5)'},
       {q: 'x² + 5x + 6', a: '(x + 2)(x + 3)', s:'Busca dos números que sumen 5 y multipliquen 6: 2 y 3.'}
     ]},

    {id:'sistemas-lineales', level:'Intermedio', title:'Sistemas de ecuaciones lineales',
     theory:[
       `Un sistema son dos ecuaciones con dos incógnitas que se cumplen a la vez. Se resuelve por <b>sustitución</b> (despejas una variable y la metes en la otra) o por <b>eliminación</b> (sumas las ecuaciones para quitar una variable).`
     ],
     examples:[
       {t: 'x + y = 10 y x − y = 2', steps:['Sumas las ecuaciones: 2x = 12, entonces x = 6.', 'Sustituyes en la primera: 6 + y = 10, entonces y = 4.', 'Comprobación: 6 − 4 = 2 ✓.']}
     ],
     exercises:[
       {q: 'x + y = 7 y x − y = 1', a: 'x = 4, y = 3'},
       {q: '2x + y = 8 y x + y = 5', a: 'x = 3, y = 2', s:'Restas las ecuaciones: x = 3, luego y = 2.'},
       {q: '2x + 3y = 12 y x − y = 1', a: 'x = 3, y = 2', s:'Despejas x = y + 1 y sustituyes: 5y = 10.'}
     ]},

    {id:'desigualdades', level:'Intermedio', title:'Desigualdades',
     theory:[
       `Se resuelven igual que una ecuación, con un cuidado: <b>si multiplicas o divides por un número negativo, el signo de la desigualdad se invierte</b>.`
     ],
     examples:[
       {t: '2x + 3 < 11', steps:['Restas 3: 2x < 8.', 'Divides entre 2: x < 4.']},
       {t: '−3x > 6', steps:['Divides entre −3, y el signo se invierte: x < −2.']}
     ],
     exercises:[
       {q: '5x − 2 ≥ 8', a: 'x ≥ 2'},
       {q: '−2x ≤ 10', a: 'x ≥ −5', s:'Al dividir entre −2 el signo cambia.'},
       {q: '3(x − 1) < x + 5', a: 'x < 4', s:'3x − 3 < x + 5, entonces 2x < 8.'}
     ]},

    {id:'polinomios', level:'Avanzado', title:'Polinomios',
     theory:[
       `Un polinomio es una suma de términos con potencias enteras no negativas de x. Su <b>grado</b> es el mayor exponente. Para evaluarlo, sustituyes x por el valor dado.`
     ],
     examples:[
       {t: 'P(x) = x² − 3x + 2, evalúa P(2)', steps:['Sustituyes: 2² − 3 · 2 + 2.', '4 − 6 + 2 = 0.', 'Como P(2) = 0, x = 2 es raíz del polinomio.']}
     ],
     exercises:[
       {q: 'Grado de 3x⁴ − x + 2', a: '4'},
       {q: 'P(x) = x² + 1, calcula P(3)', a: '10'},
       {q: '(x + 1)(x − 2)', a: 'x² − x − 2', s:'x² − 2x + x − 2.'}
     ]},

    {id:'fracciones-racionales', level:'Avanzado', title:'Fracciones racionales',
     theory:[
       `Una fracción racional tiene polinomios arriba y abajo. Para simplificarla, <b>factoriza</b> ambos lados y cancela los factores comunes. Recuerda que el denominador nunca puede valer 0.`
     ],
     examples:[
       {t: `${F('x²−4','x−2')}`, steps:['Factorizas: x² − 4 = (x − 2)(x + 2).', `Cancelas (x − 2): queda x + 2, con la condición x ≠ 2.`]}
     ],
     exercises:[
       {q: `${F('x²−9','x+3')}`, a: 'x − 3 (con x ≠ −3)'},
       {q: `${F('2x','x+1')} + ${F(1,'x+1')}`, a: `${F('2x+1','x+1')}`, s:'Mismo denominador: sumas numeradores.'},
       {q: `${F('x+1','x²−1')}`, a: `${F(1,'x−1')} (con x ≠ −1)`, s:'x² − 1 = (x − 1)(x + 1).'}
     ]},

    {id:'exponentes-logaritmos', level:'Avanzado', title:'Exponentes, radicales y logaritmos',
     theory:[
       `Leyes de exponentes: aᵐ · aⁿ = aᵐ⁺ⁿ y (aᵐ)ⁿ = aᵐⁿ.`,
       `Logaritmo: log_b(a) = c significa que bᶜ = a. Propiedades: log(xy) = log x + log y; log(xⁿ) = n · log x.`
     ],
     examples:[
       {t: 'x³ · x⁴', steps:['Se suman los exponentes: x³⁺⁴ = x⁷.']},
       {t: 'log₂ 8', steps:['Preguntas: ¿a qué potencia de 2 da 8?', '2³ = 8, entonces log₂ 8 = 3.']}
     ],
     exercises:[
       {q: 'log₃ 81', a: '4', s:'3⁴ = 81.'},
       {q: 'log 100 (base 10)', a: '2', s:'10² = 100.'},
       {q: 'Resuelve 2ˣ = 32', a: 'x = 5', s:'32 = 2⁵.'}
     ]},

    {id:'complejos', level:'Avanzado', title:'Números complejos',
     theory:[
       `Un número complejo es a + bi, con i² = −1. Se suman sumando partes reales e imaginarias por separado. Para multiplicar, usa i² = −1.`,
       `El <b>conjugado</b> de a + bi es a − bi, y el módulo es |a + bi| = √(a² + b²).`
     ],
     examples:[
       {t: '(2 + 3i) + (1 − i)', steps:['Reales: 2 + 1 = 3. Imaginarias: 3i − i = 2i.', 'Resultado: 3 + 2i.']},
       {t: 'i³', steps:['i³ = i² · i = −1 · i = −i.']}
     ],
     exercises:[
       {q: '(3 + 2i)(1 − i)', a: '5 − i', s:'3 − 3i + 2i − 2i² = 3 − i + 2.'},
       {q: 'i⁴', a: '1'},
       {q: '|3 + 4i|', a: '5', s:'√(9 + 16) = √25.'}
     ]},

    {id:'sucesiones-series', level:'Avanzado', title:'Sucesiones y series',
     theory:[
       `<b>Aritmética</b>: cada término suma una constante d. Término n: aₙ = a₁ + (n − 1)d. Suma de n términos: Sₙ = n(a₁ + aₙ) / 2.`,
       `<b>Geométrica</b>: cada término se multiplica por una constante r. Término n: aₙ = a₁ · rⁿ⁻¹. Suma de n términos: Sₙ = a₁(rⁿ − 1) / (r − 1), con r ≠ 1.`
     ],
     examples:[
       {t: '2, 5, 8, … ¿cuál es el décimo término?', steps:['a₁ = 2, d = 3.', 'a₁₀ = 2 + 9 · 3 = 29.']},
       {t: 'Suma de 1 a 100', steps:['Es aritmética con a₁ = 1, a₁₀₀ = 100, n = 100.', 'S = 100(1 + 100) / 2 = 5050.']}
     ],
     exercises:[
       {q: '3, 7, 11, … ¿término 20?', a: '79', s:'3 + 19 · 4.'},
       {q: 'Suma de 1 a 20', a: '210'},
       {q: '2, 6, 18, … ¿término 5?', a: '162', s:'2 · 3⁴.'}
     ]},

    {id:'valor-absoluto-ecuaciones', level:'Intermedio', title:'Ecuaciones con valor absoluto',
     theory:[
       `El valor absoluto |a| es la distancia de a a cero, así que siempre es positivo o cero. Si |expresión| = k con k ≥ 0, la expresión puede valer k o −k.`
     ],
     examples:[
       {t: '|2x − 1| = 5', steps:['Dos casos: 2x − 1 = 5 o 2x − 1 = −5.', 'Primer caso: x = 3. Segundo caso: x = −2.', 'Soluciones: x = 3 y x = −2.']}
     ],
     exercises:[
       {q: '|x − 3| = 4', a: 'x = 7 o x = −1'},
       {q: '|2x| = 6', a: 'x = 3 o x = −3'},
       {q: '|x + 1| = 0', a: 'x = −1', s:'Sólo hay un caso cuando el valor es 0.'},
       {q: '|x| = −2', a: 'No tiene solución', s:'El valor absoluto nunca es negativo.'}
     ]},

    {id:'valor-absoluto-desigualdades', level:'Avanzado', title:'Desigualdades con valor absoluto',
     theory:[
       `Si |expresión| < k, la expresión está entre −k y k. Si |expresión| > k, la expresión es menor que −k o mayor que k.`
     ],
     examples:[
       {t: '|x − 2| < 3', steps:['Equivale a −3 < x − 2 < 3.', 'Sumas 2 a todo: −1 < x < 5.']},
       {t: '|2x + 1| ≥ 5', steps:['Dos casos: 2x + 1 ≥ 5 o 2x + 1 ≤ −5.', 'x ≥ 2 o x ≤ −3.']}
     ],
     exercises:[
       {q: '|x| ≤ 4', a: '−4 ≤ x ≤ 4'},
       {q: '|x − 1| > 2', a: 'x < −1 o x > 3'},
       {q: '|3x| < 9', a: '−3 < x < 3'}
     ]},

    {id:'desigualdades-cuadraticas', level:'Avanzado', title:'Desigualdades cuadráticas',
     theory:[
       `Primero iguala a cero y factoriza. Después revisa en qué intervalos cambia el signo del producto: el producto de dos factores positivos o dos negativos es positivo, y uno positivo con uno negativo es negativo.`
     ],
     examples:[
       {t: 'x² − 5x + 6 ≤ 0', steps:['Factorizas: (x − 2)(x − 3) ≤ 0.', 'El producto es negativo o cero entre las raíces: 2 ≤ x ≤ 3.']}
     ],
     exercises:[
       {q: 'x² − 4 > 0', a: 'x < −2 o x > 2'},
       {q: 'x² + x − 6 < 0', a: '−3 < x < 2', s:'(x + 3)(x − 2) < 0.'},
       {q: 'x² − 2x + 1 ≥ 0', a: 'Todos los números reales', s:'(x − 1)² nunca es negativo.'}
     ]},

    {id:'ecuaciones-exp-log', level:'Avanzado', title:'Ecuaciones exponenciales y logarítmicas',
     theory:[
       `Para una ecuación exponencial, iguala las bases (si son iguales) o aplica logaritmo. Para una ecuación logarítmica, usa la definición: log_b(a) = c equivale a b^c = a.`
     ],
     examples:[
       {t: '2^(x + 1) = 8', steps:['8 = 2³, entonces x + 1 = 3.', 'x = 2.']},
       {t: 'log₂(x + 1) = 3', steps:['Por definición: 2³ = x + 1.', '8 = x + 1, entonces x = 7.']}
     ],
     exercises:[
       {q: '5ˣ = 125', a: 'x = 3'},
       {q: '2^(2x) = 16', a: 'x = 2', s:'16 = 2⁴, entonces 2x = 4.'},
       {q: 'log₃(x) = 2', a: 'x = 9'},
       {q: 'log(2x) = 1 (base 10)', a: 'x = 5', s:'2x = 10.'}
     ]},

    {id:'complejos-polar', level:'Avanzado', title:'Complejos: forma polar y raíces',
     theory:[
       `Todo complejo z = a + bi se puede escribir en forma polar: z = r(cos θ + i sen θ), con r = |z| = √(a² + b²) y θ el ángulo que forma con el eje real positivo.`,
       `Raíces de números negativos: √(−n) = i√n. Por ejemplo, √(−4) = 2i.`
     ],
     examples:[
       {t: 'Forma polar de 1 + i', steps:['r = √(1 + 1) = √2.', 'θ = 45°, porque tan θ = 1 / 1.', 'Resultado: √2 (cos 45° + i sen 45°).']}
     ],
     exercises:[
       {q: '√(−4)', a: '2i'},
       {q: 'Módulo de 3 − 4i', a: '5', s:'√(9 + 16) = 5.'},
       {q: 'Forma polar de −2', a: '2(cos 180° + i sen 180°)', s:'r = 2 y el ángulo es 180°.'}
     ]},

    {id:'notacion-sigma', level:'Intermedio', title:'Notación sigma (Σ) y sumas conocidas',
     theory:[
       `Σ indica una suma. Σ de k = 1 a n de k significa 1 + 2 + … + n. Fórmulas útiles: Σk = n(n + 1) / 2 y Σk² = n(n + 1)(2n + 1) / 6.`
     ],
     examples:[
       {t: 'Σ de k = 1 a 5 de k', steps:['Sumas los términos: 1 + 2 + 3 + 4 + 5 = 15.', 'Con la fórmula: 5 × 6 / 2 = 15.']}
     ],
     exercises:[
       {q: 'Σ de k = 1 a 4 de 2k', a: '20'},
       {q: 'Σ de k = 1 a 3 de k²', a: '14', s:'1 + 4 + 9.'},
       {q: 'Σ de k = 1 a 10 de 1', a: '10', s:'Sumar 1 diez veces.'}
     ]},

    {id:'series-geometricas-infinitas', level:'Avanzado', title:'Series geométricas infinitas',
     theory:[
       `Si |r| < 1, la suma infinita de una serie geométrica converge: S = a₁ / (1 − r). Si |r| ≥ 1, la suma no existe.`
     ],
     examples:[
       {t: '1 + 1/2 + 1/4 + …', steps:['a₁ = 1, r = 1/2 (|r| < 1, sí converge).', 'S = 1 / (1 − 1/2) = 2.']}
     ],
     exercises:[
       {q: '1/3 + 1/9 + 1/27 + …', a: F(1,2), s:'a₁ = 1/3, r = 1/3: (1/3) / (2/3).'},
       {q: '3 + 1.5 + 0.75 + …', a: '6'},
       {q: '4 − 2 + 1 − …', a: F(8,3), s:'r = −1/2: 4 / (3/2).'},
       {q: '2 + 4 + 8 + …', a: 'No converge', s:'r = 2 es mayor que 1.'}
     ]},

    {id:'ecuaciones-racionales', level:'Intermedio', title:'Ecuaciones con fracciones racionales',
     theory:[
       `Para resolver una ecuación con x en el denominador, multiplica en cruz o por el denominador común. Después revisa que el valor encontrado no haga cero ningún denominador: esos valores se descartan.`
     ],
     examples:[
       {t: `${F(3,'x−1')} = 2`, steps:['Multiplicas por x − 1: 3 = 2(x − 1).', '3 = 2x − 2, entonces x = 5/2.', 'Como x ≠ 1, la solución es válida.']}
     ],
     exercises:[
       {q: `${F(6,'x')} = 2`, a: 'x = 3'},
       {q: `${F('x+1','x−1')} = 2`, a: 'x = 3', s:'x + 1 = 2x − 2.'},
       {q: `${F(1,'x−2')} = ${F(1,'3x')}`, a: 'x = −1', s:'Multiplicas en cruz: 3x = x − 2, entonces x = −1.'}
     ]}
  ],

  lin: [
    {id:'vectores', level:'Básico', title:'Vectores: suma, escalar y norma',
     theory:[
       `Un vector en el plano es un par ordenado (x, y). Se suman componente a componente, y se multiplica por un escalar multiplicando cada componente.`,
       `La <b>norma</b> (longitud) de (x, y) es √(x² + y²).`
     ],
     examples:[
       {t: '(1, 2) + (3, −1)', steps:['Sumas componente a componente: (1 + 3, 2 + (−1)).', 'Resultado: (4, 1).']},
       {t: '|(3, 4)|', steps:['√(3² + 4²) = √25 = 5.']}
     ],
     exercises:[
       {q: '(2, 5) + (−1, 3)', a: '(1, 8)'},
       {q: '2 · (−3, 4)', a: '(−6, 8)'},
       {q: '|(6, 8)|', a: '10'}
     ]},

    {id:'producto-punto', level:'Intermedio', title:'Producto punto y ángulo entre vectores',
     theory:[
       `El producto punto es a · b = a₁b₁ + a₂b₂. Si a · b = 0, los vectores son <b>perpendiculares (ortogonales)</b>.`,
       `Ángulo: cos θ = (a · b) / (|a| |b|).`
     ],
     examples:[
       {t: '(1, 2) · (3, 4)', steps:['1 · 3 + 2 · 4 = 3 + 8 = 11.']}
     ],
     exercises:[
       {q: '(2, −1) · (1, 2)', a: '0', s:'Son perpendiculares.'},
       {q: 'Ángulo entre (1, 0) y (1, 1)', a: '45°', s:`cos θ = 1 / (1 · √2) = ${F(1,'√2')}.`}
     ]},

    {id:'matrices', level:'Básico', title:'Matrices: suma, escalar y dimensión',
     theory:[
       `Una matriz es un arreglo rectangular de números. Si tiene m filas y n columnas, es de dimensión m × n. Sólo se suman matrices de la misma dimensión, y el escalar multiplica cada entrada.`
     ],
     examples:[
       {t: '[1 2; 3 4] + [0 1; 1 0]', steps:['Sumas entrada por entrada: [1 3; 4 4].']}
     ],
     exercises:[
       {q: '2 · [1 0; 2 3]', a: '[2 0; 4 6]'},
       {q: '[1 2; 0 1] + [3 3; 3 3]', a: '[4 5; 3 4]'},
       {q: 'Dimensión de una matriz de 2 × 3', a: '6 entradas', s:'Tiene 2 filas y 3 columnas.'}
     ]},

    {id:'multiplicacion-matrices', level:'Intermedio', title:'Multiplicación de matrices',
     theory:[
       `Para multiplicar A · B, cada entrada del resultado es el producto punto de una fila de A con una columna de B. Se puede multiplicar sólo si las columnas de A igualan las filas de B. Además, el orden importa: en general A · B ≠ B · A.`
     ],
     examples:[
       {t: '[1 2; 3 4] · [0 1; 1 0]', steps:['Fila 1 · columna 1: 1·0 + 2·1 = 2.', 'Fila 1 · columna 2: 1·1 + 2·0 = 1.', 'Fila 2 · columna 1: 3·0 + 4·1 = 4; fila 2 · columna 2: 3·1 + 4·0 = 3.', 'Resultado: [2 1; 4 3].']}
     ],
     exercises:[
       {q: '[2 0; 1 3] · [1 1; 0 2]', a: '[2 2; 1 7]'},
       {q: '[5 2; 1 3] · [1 0; 0 1]', a: '[5 2; 1 3]', s:'Multiplicar por la identidad no cambia la matriz.'},
       {q: '[1 2; 3 4] · (1, 1)', a: '(3, 7)', s:'Cada fila por el vector: 1 + 2 = 3, 3 + 4 = 7.'}
     ]},

    {id:'determinantes', level:'Intermedio', title:'Determinantes',
     theory:[
       `Para una matriz 2 × 2 [a b; c d], el determinante es ad − bc. Para 3 × 3, desarrolla por una fila: a₁₁(a₂₂a₃₃ − a₂₃a₃₂) − a₁₂(a₂₁a₃₃ − a₂₃a₃₁) + a₁₃(a₂₁a₃₂ − a₂₂a₃₁).`,
       `Si el determinante es 0, la matriz no tiene inversa.`
     ],
     examples:[
       {t: 'det [3 1; 4 2]', steps:['3 · 2 − 1 · 4 = 6 − 4 = 2.']}
     ],
     exercises:[
       {q: 'det [5 2; 1 3]', a: '13'},
       {q: 'det [1 2; 2 4]', a: '0', s:'La segunda fila es el doble de la primera: no tiene inversa.'},
       {q: 'det [1 0 2; 0 1 0; 3 0 1]', a: '−5', s:'Desarrollo por la segunda columna o la regla de cofactores: 1 · 1 · 1 + 2 · (0 − 3) = −5.'}
     ]},

    {id:'inversa-sistemas', level:'Avanzado', title:'Matriz inversa y sistemas de ecuaciones',
     theory:[
       `Para una matriz 2 × 2 con determinante distinto de cero: A⁻¹ = (1 / det) · [d −b; −c a]. Un sistema A · x = b se resuelve con x = A⁻¹ · b.`
     ],
     examples:[
       {t: 'Inversa de [2 1; 1 1]', steps:['det = 2 · 1 − 1 · 1 = 1.', 'A⁻¹ = [1 −1; −1 2].']}
     ],
     exercises:[
       {q: 'Inversa de [3 1; 5 2]', a: '[2 −1; −5 3]', s:'det = 1.'},
       {q: '¿Tiene inversa [1 2; 2 4]?', a: 'No', s:'det = 0.'},
       {q: 'Resuelve x + y = 3, x − y = 1 con matrices', a: 'x = 2, y = 1', s:'La inversa de [1 1; 1 −1] da x = (3 + 1)/2 y y = (3 − 1)/2.'}
     ]},

    {id:'valores-propios', level:'Avanzado', title:'Valores y vectores propios',
     theory:[
       `Un vector v ≠ 0 es propio de A si A · v = λ · v; λ es el <b>valor propio</b>. Se encuentran resolviendo det(A − λI) = 0.`
     ],
     examples:[
       {t: 'Valores propios de [3 1; 0 2]', steps:['det [3−λ 1; 0 2−λ] = (3 − λ)(2 − λ) = 0.', 'λ = 3 o λ = 2.']}
     ],
     exercises:[
       {q: 'Valores propios de [4 0; 0 −1]', a: 'λ = 4 y λ = −1'},
       {q: 'Valores propios de [1 2; 2 1]', a: 'λ = 3 y λ = −1', s:'(1 − λ)² − 4 = 0.'},
       {q: 'Valores propios de [5 0; 0 5]', a: 'λ = 5 (doble)'}
     ]},

    {id:'espacios-vectoriales', level:'Avanzado', title:'Espacios vectoriales y subespacios',
     theory:[
       `Un espacio vectorial es un conjunto donde se pueden sumar vectores y multiplicarlos por escalares, con reglas como la asociatividad y la existencia del vector cero. Un <b>subespacio</b> es un subconjunto que contiene al 0 y es cerrado bajo suma y multiplicación por escalares.`,
       `La <b>dimensión</b> es el número de vectores de una base. ℝ² tiene dimensión 2 y ℝ³ tiene dimensión 3.`
     ],
     examples:[
       {t: '¿{(x, y) : x + y = 0} es subespacio de ℝ²?', steps:['Contiene al (0, 0): 0 + 0 = 0 ✓.', 'Cerrado bajo suma y escalares: sí, la condición x + y = 0 se conserva.', 'Sí es subespacio.']}
     ],
     exercises:[
       {q: '¿{(x, y) : x = 1} es subespacio de ℝ²?', a: 'No', s:'No contiene al (0, 0).'},
       {q: 'Dimensión de ℝ³', a: '3'},
       {q: 'Una base de ℝ²', a: '{(1, 0), (0, 1)}'}
     ]},

    {id:'transformaciones-lineales', level:'Avanzado', title:'Transformaciones lineales',
     theory:[
       `Una transformación lineal T cumple T(u + v) = T(u) + T(v) y T(c · u) = c · T(u). Toda transformación lineal de ℝⁿ a ℝᵐ se puede representar con una matriz.`
     ],
     examples:[
       {t: 'T(x, y) = (x + y, x − y)', steps:['La matriz es [1 1; 1 −1].', 'T(2, 1) = (3, 1).']}
     ],
     exercises:[
       {q: 'Matriz de la rotación de 90° T(x, y) = (−y, x)', a: '[0 −1; 1 0]'},
       {q: 'Núcleo de T(x, y) = (x, 0)', a: '{(0, y)}', s:'Los vectores que se van a (0, 0).'},
       {q: 'T(1, 0) cuando T(x, y) = (−y, x)', a: '(0, 1)'}
     ]}
  ],

  abs: [
    {id:'operaciones-binarias', level:'Básico', title:'Operaciones binarias',
     theory:[
       `Una operación binaria combina dos elementos de un conjunto y da otro elemento del mismo conjunto. Propiedades importantes: <b>cerradura</b> (el resultado sigue en el conjunto), <b>conmutatividad</b> (a · b = b · a) y <b>asociatividad</b> ((a · b) · c = a · (b · c)).`
     ],
     examples:[
       {t: 'Suma en ℕ', steps:['Cerrada: la suma de dos naturales es natural.', 'Conmutativa y asociativa: sí.']},
       {t: 'Resta en ℕ', steps:['No es cerrada: 3 − 5 = −2, que no es natural.']}
     ],
     exercises:[
       {q: '¿Es cerrada la multiplicación en ℤ?', a: 'Sí'},
       {q: '¿Es cerrada la división en ℤ?', a: 'No', s:'Por ejemplo, 1 ÷ 2 no es entero.'},
       {q: '¿Es conmutativa la resta en ℤ?', a: 'No', s:'3 − 5 ≠ 5 − 3.'}
     ]},

    {id:'grupos', level:'Avanzado', title:'Grupos',
     theory:[
       `Un grupo (G, ∗) es un conjunto con una operación que cumple: <b>cerradura</b>, <b>asociatividad</b>, existencia de un <b>elemento identidad</b> e para el que e ∗ a = a, y un <b>inverso</b> a⁻¹ para cada a, con a ∗ a⁻¹ = e.`
     ],
     examples:[
       {t: '(ℤ, +) es grupo', steps:['Cerrada: sí. Asociativa: sí. Identidad: 0. Inverso de a: −a.', 'Sí es grupo.']}
     ],
     exercises:[
       {q: '¿(ℕ, +) es grupo?', a: 'No', s:'No tiene inversos: el 1 no tiene inverso natural.'},
       {q: '¿(ℤ, ·) es grupo?', a: 'No', s:'El 2 no tiene inverso entero para la multiplicación.'},
       {q: '¿(ℤ₅, +) es grupo?', a: 'Sí', s:'Los residuos módulo 5 forman un grupo bajo suma.'}
     ]},

    {id:'subgrupos-lagrange', level:'Avanzado', title:'Subgrupos y teorema de Lagrange',
     theory:[
       `Un subgrupo es un subconjunto de un grupo que también es grupo con la misma operación. El <b>teorema de Lagrange</b> dice que el orden (número de elementos) de cualquier subgrupo divide al orden del grupo.`
     ],
     examples:[
       {t: 'Subgrupo {0, 3} de ℤ₆', steps:['Tiene 2 elementos.', '2 divide a 6, así que es posible. En efecto, 3 + 3 = 0 en ℤ₆.']}
     ],
     exercises:[
       {q: '¿Puede haber un subgrupo de orden 5 en ℤ₁₂?', a: 'No', s:'5 no divide a 12.'},
       {q: '¿Existe un subgrupo de orden 4 en ℤ₁₂?', a: 'Sí: {0, 3, 6, 9}', s:'4 divide a 12.'}
     ]},

    {id:'anillos', level:'Avanzado', title:'Anillos',
     theory:[
       `Un anillo (A, +, ·) es un conjunto con dos operaciones: (A, +) es un grupo abeliano, y la multiplicación es asociativa y distribuye sobre la suma. No siempre hay inversos multiplicativos.`
     ],
     examples:[
       {t: 'ℤ con suma y multiplicación', steps:['(ℤ, +) es grupo abeliano.', 'La multiplicación es asociativa y distributiva. Entonces ℤ es anillo.']}
     ],
     exercises:[
       {q: '¿ℤ₆ es anillo?', a: 'Sí', s:'Es anillo, aunque tiene divisores de cero.'},
       {q: 'En ℤ₆, ¿2 · 3 = ?', a: '0', s:'Es un divisor de cero: 2 y 3 no son cero, pero su producto sí.'}
     ]},

    {id:'cuerpos', level:'Avanzado', title:'Cuerpos',
     theory:[
       `Un cuerpo es un anillo conmutativo con unidad en el que todo elemento distinto de cero tiene inverso multiplicativo. Ejemplos: ℚ, ℝ, ℂ y ℤₚ cuando p es primo.`
     ],
     examples:[
       {t: '¿ℤ₇ es cuerpo?', steps:['7 es primo, así que todo residuo distinto de 0 tiene inverso.', 'Sí es cuerpo.']}
     ],
     exercises:[
       {q: '¿ℤ es cuerpo?', a: 'No', s:'El 2 no tiene inverso entero.'},
       {q: '¿ℤ₆ es cuerpo?', a: 'No', s:'2 · 3 = 0 y 6 no es primo.'},
       {q: '¿ℚ es cuerpo?', a: 'Sí'}
     ]},

    {id:'homomorfismos', level:'Avanzado', title:'Homomorfismos',

    examples: [
      {t: '|x − 2| &lt; 3', steps:['−3 &lt; x − 2 &lt; 3.', 'Sumas 2: −1 &lt; x &lt; 5.']},
      {t: '|x + 1| ≥ 4', steps:['x + 1 ≥ 4 o x + 1 ≤ −4.', 'x ≥ 3 o x ≤ −5.']}
    ]
  },
  'desigualdades-cuadraticas': {
    theory: [`<b>Método paso a paso:</b> 1) iguala a cero y resuelve la ecuación; 2) ubica las raíces en la recta numérica; 3) prueba un valor en cada intervalo para saber el signo.`],
    examples: [
      {t: 'x² − x − 6 &lt; 0', steps:['Factorizas: (x − 3)(x + 2) &lt; 0. Raíces: −2 y 3.', 'Pruebas x = 0: (−3)(2) = −6 &lt; 0, cumple.', 'Solución: −2 &lt; x &lt; 3.']},
      {t: 'x² − 4 ≥ 0', steps:['(x − 2)(x + 2) ≥ 0. Raíces: −2 y 2.', 'Pruebas x = 0: −4, no cumple. Pruebas x = 3: 5, sí cumple.', 'Solución: x ≤ −2 o x ≥ 2.']}
    ]
  },
  'ecuaciones-exp-log': {
    theory: [`<b>Estrategia:</b> para ecuaciones exponenciales, iguala bases o aplica logaritmos. Para logarítmicas, usa las propiedades y verifica el dominio (el argumento del logaritmo debe ser positivo).`],
    examples: [
      {t: '3ˣ⁺¹ = 27', steps:['27 = 3³, así que x + 1 = 3 y x = 2.']},
      {t: 'log x + log(x − 3) = 1', steps:['Dominio: x &gt; 3.', 'log[x(x − 3)] = 1, entonces x(x − 3) = 10.', 'x² − 3x − 10 = 0 → (x − 5)(x + 2) = 0.', 'x = 5 (x = −2 no está en el dominio).']}
    ]
  },
  'complejos-polar': {
    theory: [`<b>Forma polar:</b> z = r(cos θ + i sen θ), donde r = √(a² + b²) y θ es el ángulo. <b>Producto:</b> multiplicas módulos y sumas ángulos. <b>Cociente:</b> divides módulos y restas ángulos.`],
    examples: [
      {t: 'Pasa 1 + i√3 a forma polar', steps:['r = √(1 + 3) = 2.', 'θ = 60° (porque cos θ = 1/2 y sen θ = √3/2).', 'Resultado: 2(cos 60° + i sen 60°).']},
      {t: '[2(cos 30° + i sen 30°)] · [3(cos 60° + i sen 60°)]', steps:['Módulos: 2 · 3 = 6.', 'Ángulos: 30° + 60° = 90°.', 'Resultado: 6(cos 90° + i sen 90°) = 6i.']}
    ]
  },
  'notacion-sigma': {
    theory: [`<b>Sumatoria:</b> Σ de k = a hasta b significa sumar la expresión para cada k entre a y b. Fórmulas útiles: Σ k = n(n + 1)/2 y Σ k² = n(n + 1)(2n + 1)/6.`],
    examples: [
      {t: 'Σ (2k + 1) desde k = 1 hasta 4', steps:['k = 1: 3. k = 2: 5. k = 3: 7. k = 4: 9.', 'Suma: 24.']},
      {t: 'Σ k desde k = 1 hasta 10', steps:['Fórmula: 10 · 11 / 2 = 55.']}
    ]
  },
  'series-geometricas-infinitas': {
    theory: [`<b>Serie geométrica infinita:</b> si |r| &lt; 1, la suma es S = a₁ / (1 − r). Si |r| ≥ 1, la serie no converge.`],
    examples: [
      {t: '1 + 1/2 + 1/4 + …', steps:['a₁ = 1, r = 1/2.', 'S = 1 / (1 − 1/2) = 2.']},
      {t: 'Expresa 0.333… como fracción', steps:['0.333… = 3/10 + 3/100 + …, con a₁ = 3/10 y r = 1/10.', 'S = (3/10) / (9/10) = 1/3.']}
    ]
  },
  'ecuaciones-racionales': {
    theory: [`<b>Método paso a paso:</b> 1) identifica los valores que anulan algún denominador (no válidos); 2) multiplica toda la ecuación por el mínimo común denominador; 3) resuelve; 4) descarta soluciones no válidas.`],
    examples: [
      {t: '3/x + 1 = 4/x', steps:['Multiplicas por x (x ≠ 0): 3 + x = 4.', 'x = 1. Válida.']},
      {t: 'x/(x − 2) = 2 + 2/(x − 2)', steps:['Multiplicas por (x − 2), con x ≠ 2: x = 2(x − 2) + 2.', 'x = 2x − 2, entonces x = 2.', 'Pero x = 2 no es válida. La ecuación no tiene solución.']}
    ]
  },
  'vectores': {
    theory: [`<b>Vectores en el plano:</b> u = (a, b). <b>Suma:</b> se suman componente a componente. <b>Escalar:</b> k·u = (ka, kb). <b>Norma:</b> |u| = √(a² + b²).`],
    examples: [
      {t: 'u = (1, 2), v = (3, −1). Calcula u + v, 2u − v y |u|', steps:['u + v = (4, 1).', '2u − v = (2 − 3, 4 + 1) = (−1, 5).', '|u| = √(1 + 4) = √5.']}
    ]
  },
  'producto-punto': {
    theory: [`<b>Producto punto:</b> u · v = a·c + b·d. Si u · v = 0, los vectores son perpendiculares. Además, u · v = |u||v| cos θ.`],
    examples: [
      {t: '(1, 2) · (3, −1)', steps:['1·3 + 2·(−1) = 3 − 2 = 1.']},
      {t: '¿(2, 3) y (−3, 2) son perpendiculares?', steps:['(2)(−3) + (3)(2) = −6 + 6 = 0.', 'Sí, son perpendiculares.']}
    ]
  },
  'matrices': {
    theory: [`<b>Matriz:</b> arreglo de números en filas y columnas. <b>Suma:</b> sumas elemento a elemento (las matrices deben tener el mismo tamaño). <b>Transpuesta:</b> cambias filas por columnas.`],
    examples: [
      {t: 'A = [1 2; 3 4], B = [0 1; 1 0]. Calcula A + B', steps:['Sumas elemento a elemento: [1 3; 4 4].']},
      {t: 'Transpuesta de [1 2 3]', steps:['Cambias filas por columnas: la columna [1; 2; 3].']}
    ]
  },
  'multiplicacion-matrices': {
    theory: [`<b>Regla:</b> el elemento (i, j) del producto es la fila i de la primera matriz multiplicada por la columna j de la segunda, sumando los productos. El número de columnas de la primera debe coincidir con el número de filas de la segunda. En general AB ≠ BA.`],
    examples: [
      {t: '[1 2; 3 4] · [2; 1]', steps:['Primera fila: 1·2 + 2·1 = 4.', 'Segunda fila: 3·2 + 4·1 = 10.', 'Resultado: [4; 10].']},
      {t: '[1 0; 2 1] · [1 2; 3 4]', steps:['Fila 1 por columnas: [1·1 + 0·3, 1·2 + 0·4] = [1, 2].', 'Fila 2: [2·1 + 1·3, 2·2 + 1·4] = [5, 8].', 'Resultado: [1 2; 5 8].']}
    ]
  },
  'determinantes': {
    theory: [`<b>2×2:</b> det [a b; c d] = ad − bc. <b>3×3:</b> desarrollas por una fila o columna, multiplicando cada elemento por el determinante de su menor y con signo alternado (+, −, +).`],
    examples: [
      {t: 'det [3 1; 2 4]', steps:['3·4 − 1·2 = 12 − 2 = 10.']},
      {t: 'det [1 2 0; 0 1 3; 1 0 1]', steps:['Desarrollo por la primera fila: 1·(1·1 − 3·0) − 2·(0·1 − 3·1) + 0.', '= 1·1 − 2·(−3) = 1 + 6 = 7.']}
    ]
  },
  'inversa-sistemas': {
    theory: [`<b>Método matricial:</b> si A·x = b, entonces x = A⁻¹·b. Para una matriz 2×2, A⁻¹ = (1/det A) · [d −b; −c a]. Solo existe si det A ≠ 0.`],
    examples: [
      {t: 'Resuelve 2x + y = 5, x + y = 3', steps:['A = [2 1; 1 1], det A = 2 − 1 = 1.', 'A⁻¹ = [1 −1; −1 2].', 'x = A⁻¹·b = [1·5 − 1·3; −1·5 + 2·3] = [2; 1].', 'Comprobación: 2·2 + 1 = 5 ✓ y 2 + 1 = 3 ✓.']}
    ]
  },
  'valores-propios': {
    theory: [`<b>Método paso a paso:</b> 1) resuelve det(A − λI) = 0 para obtener los valores propios λ; 2) para cada λ, resuelve (A − λI)v = 0 para obtener el vector propio v.`],
    examples: [
      {t: 'A = [2 1; 1 2]', steps:['det(A − λI) = (2 − λ)² − 1 = 0, entonces λ = 1 o λ = 3.', 'Para λ = 3: A − 3I = [−1 1; 1 −1]. Solución: v = (1, 1).']}
    ]
  },
  'espacios-vectoriales': {
    theory: [`<b>Subespacio:</b> debe contener al vector cero y ser cerrado bajo suma y multiplicación por escalar. <b>Independencia lineal:</b> si a·v₁ + b·v₂ = 0 solo tiene la solución a = b = 0, son independientes.`],
    examples: [
      {t: '¿W = {(x, y) : y = 2x} es subespacio de ℝ²?', steps:['El cero (0, 0) cumple 0 = 2·0 ✓.', 'Si (x, 2x) + (z, 2z) = (x + z, 2(x + z)), sigue en W ✓.', 'Sí es subespacio.']},
      {t: '¿(1, 1, 0) y (0, 1, 1) son independientes?', steps:['a(1, 1, 0) + b(0, 1, 1) = 0 da a = 0, a + b = 0, b = 0.', 'Solo hay solución trivial: son independientes.']}
    ]
  },
  'transformaciones-lineales': {
    theory: [`<b>Transformación lineal:</b> T(x, y) se puede escribir como una matriz. <b>Núcleo:</b> vectores que T manda al cero. <b>Dimensión:</b> dim(núcleo) + dim(imagen) = dim del dominio.`],
    examples: [
      {t: 'T(x, y) = (x + y, x − y). Calcula T(2, 3)', steps:['T(2, 3) = (2 + 3, 2 − 3) = (5, −1).', 'Matriz asociada: [1 1; 1 −1].']},
      {t: 'Núcleo de T(x, y) = (x − y, 2x − 2y)', steps:['x − y = 0, entonces x = y.', 'El núcleo es la recta {(t, t)}, de dimensión 1.']}
    ]
  },
  'operaciones-binarias': {
    theory: [`<b>Operación binaria:</b> regla que combina dos elementos de un conjunto. Propiedades a revisar: conmutativa (a∗b = b∗a), asociativa ((a∗b)∗c = a∗(b∗c)) y elemento neutro (e tal que a∗e = a).`],
    examples: [
      {t: 'a∗b = a + b − 1 en los enteros', steps:['Conmutativa: a + b − 1 = b + a − 1 ✓.', 'Asociativa: ambos lados dan a + b + c − 2 ✓.', 'Neutro: a + e − 1 = a, entonces e = 1.']}
    ]
  },
  'grupos': {
    theory: [`<b>Grupo (G, ∗):</b> cumple cerradura, asociatividad, elemento neutro e inverso para cada elemento. Si además es conmutativo, es un grupo abeliano.`],
    examples: [
      {t: 'Z₄ = {0, 1, 2, 3} con suma módulo 4', steps:['Cerradura: por ejemplo 2 + 3 = 5 ≡ 1 (mod 4) ✓.', 'Neutro: 0. Inverso de 1: 3, porque 1 + 3 = 4 ≡ 0.', 'Es un grupo abeliano.']}
    ]
  },
  'subgrupos-lagrange': {
    theory: [`<b>Subgrupo:</b> subconjunto que también es grupo con la misma operación. <b>Teorema de Lagrange:</b> el orden de un subgrupo divide al orden del grupo.`],
    examples: [
      {t: '{0, 2} dentro de Z₄', steps:['{0, 2} es cerrado bajo suma módulo 4 y tiene inverso: es subgrupo.', 'Orden 2 divide a 4 ✓.']},
      {t: '{0, 2, 4} dentro de Z₆', steps:['Es subgrupo de orden 3.', '3 divide a 6 ✓.']}
    ]
  },
  'anillos': {
    theory: [`<b>Anillo (R, +, ·):</b> R es grupo abeliano con la suma, y la multiplicación es asociativa y distributiva respecto a la suma. Puede tener divisores de cero.`],
    examples: [
      {t: 'Z₆ con suma y multiplicación módulo 6', steps:['Es anillo: cumple todas las propiedades.', 'Tiene divisores de cero: 2 · 3 = 6 ≡ 0 (mod 6), con 2 ≠ 0 y 3 ≠ 0.']}
    ]
  },
  'cuerpos': {
    theory: [`<b>Cuerpo:</b> anillo conmutativo en el que todo elemento distinto de cero tiene inverso multiplicativo. Ejemplos: ℚ, ℝ, ℂ. Z_p es cuerpo si p es primo.`],
    examples: [
      {t: 'Z₅ es cuerpo: inverso de 2', steps:['Buscamos x con 2x ≡ 1 (mod 5).', 'x = 3, porque 2 · 3 = 6 ≡ 1 (mod 5).']}
    ]
  },
  'homomorfismos': {
    theory: [`<b>Homomorfismo:</b> función φ entre grupos que respeta la operación: φ(a ∗ b) = φ(a) ∗ φ(b). Si además es biyectivo, es un isomorfismo.`],
    examples: [
      {t: 'φ: Z → Z₂, φ(n) = n mod 2', steps:['Comprobación con a = 3, b = 5: φ(3 + 5) = φ(8) = 0.', 'φ(3) + φ(5) = 1 + 1 = 0 (mod 2) ✓.', 'Es homomorfismo.']}
    ]
  },
  'ec-dos-pasos': {
    theory: [`<b>Método paso a paso:</b> 1) quita primero la suma o resta; 2) después quita la multiplicación o división; 3) comprueba sustituyendo.`],
    examples: [
      {t: `${F('x',3)} + 2 = 6`, steps:['Restas 2: ' + F('x',3) + ' = 4.', 'Multiplicas por 3: x = 12.']},
      {t: '4 − 2x = 10', steps:['Restas 4: −2x = 6.', 'Divides entre −2: x = −3.', 'Comprobación: 4 − 2(−3) = 10 ✓.']}
    ]
  }
};

/* ---------- Pantallas ---------- */
function renderResult(r) {
  return `<div class="panel"><div class="result">${r.lines.join('<br>')}</div>
    ${showSteps && r.steps.length ? `<ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}</div>`;
}
const stepsToggle = () => `<label class="toggle"><input type="checkbox" id="st" ${showSteps ? 'checked' : ''} style="width:auto"> Mostrar pasos</label>`;
function bindToggle() {
  const el = document.getElementById('st');
  if (el) el.onchange = () => { showSteps = el.checked; try { localStorage.setItem('mp-steps', showSteps ? '1' : '0'); } catch(e) {} };
}

function renderHome() {
  app.innerHTML = `<p class="hint">Elige un tema. Empieza por lo básico: cada tema tiene ejemplos resueltos y ejercicios con respuesta.</p>
    <div class="grid">${TOPICS.map(t => `
      <button class="card" data-id="${t.id}" ${t.ready ? '' : 'disabled'}>
        <b>${esc(t.name)}</b><small>${esc(t.desc)}</small><br>
        <span class="tag ${t.ready ? '' : 'soon'}">${t.ready ? 'Disponible' : 'Etapa ' + t.stage}</span>
      </button>`).join('')}</div>`;
  app.querySelectorAll('.card:not([disabled])').forEach(b => b.onclick = () => location.hash = b.dataset.id);
}

function renderSoon(t) {
  app.innerHTML = `<div class="panel"><p>${esc(t.name)} llega en la <b>etapa ${t.stage}</b>. Por ahora esta versión cubre aritmética y álgebra.</p></div>`;
}

/* Colores y progreso */
const LEVEL_COLORS = {'Básico': '#15803d', 'Intermedio': '#b45309', 'Avanzado': '#b91c1c'};
const LEVEL_BG = {'Básico': '#dcfce7', 'Intermedio': '#fef3c7', 'Avanzado': '#fee2e2'};
const getDone = () => { try { return JSON.parse(localStorage.getItem('mp-done')) || {}; } catch(e) { return {}; } };
const setDone = o => { try { localStorage.setItem('mp-done', JSON.stringify(o)); } catch(e) {} };
const countDone = l => { const d = getDone(); return l.exercises.filter((_, i) => d[`${l.id}:${i}`]).length; };
let levelTab = 'Básico';
let lessonTab = 'teoria';

/* Lista de lecciones de un tema, con pestañas de nivel arriba */
function renderTopic(t) {
  const list = LESSONS[t.id] || [];
  const ls = list.filter(l => l.level === levelTab);
  app.innerHTML = `
    <div class="seg">${LEVELS.map(lv => `<button class="${lv === levelTab ? 'on' : ''}" data-lv="${lv}">${lv}</button>`).join('')}</div>
    <div class="lessons">${ls.map((l, i) => {
      const done = countDone(l), total = l.exercises.length;
      const pct = Math.round(done / total * 100);
      return `<button class="lesson" data-l="${l.id}">
        <span class="num">${i + 1}</span>
        <span class="lt"><b>${l.title}</b>
          <span class="bar"><span style="width:${pct}%"></span></span>
          <small>${done} de ${total} ejercicios hechos</small></span>
        <span class="chev">›</span></button>`;
    }).join('')}</div>`;
  app.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { levelTab = b.dataset.lv; renderTopic(t); });
  app.querySelectorAll('.lesson').forEach(b => b.onclick = () => { lessonTab = 'teoria'; location.hash = `${t.id}/${b.dataset.l}`; });
}

/* Convierte [a b; c d] en una matriz con corchetes, como en un libro */
function matHTML(s) {
  return s.replace(/\[([^\[\];]+(?:;[^\[\];]+)+)\]/g, (m, inner) => {
    const rows = inner.split(';').map(r => r.trim().split(/\s+/));
    return `<span class="mat">${rows.map(r => `<span class="mrow">${r.map(v => `<span>${v}</span>`).join('')}</span>`).join('')}</span>`;
  });
}

/* Lección: pestañas Teoría / Ejemplos / Ejercicios, para no tener que bajar mucho */
function renderLesson(t, id) {
  const list = LESSONS[t.id] || [];
  const idx = list.findIndex(l => l.id === id);
  const L = list[idx];
  if (!L) { app.innerHTML = '<p class="err">Esa lección no existe.</p>'; return; }
  const prev = list[idx - 1], next = list[idx + 1];
  const done = getDone();
  const extra = EXTRA[L.id] || {};
  const allTheory = [...L.theory, ...(extra.theory || [])];
  const allExamples = [...L.examples, ...(extra.examples || [])];
  const bodies = {
    teoria: `<div class="card-box">${allTheory.map(p => `<p>${p}</p>`).join('')}</div>`,
    ejemplos: allExamples.map((ex, i) => `
      <div class="card-box">
        <div class="ex-h">Ejemplo ${i + 1}</div>
        <p class="ex-t">${ex.t}</p>
        <ol class="steps">${ex.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`).join(''),
    ejercicios: L.exercises.map((ex, i) => {
      const ok = !!done[`${L.id}:${i}`];
      return `<div class="card-box exo ${ok ? 'ok' : ''}">
        <div class="exo-h">
          <span class="badge">${i + 1}</span>
          <label class="check"><input type="checkbox" data-done="${L.id}:${i}" ${ok ? 'checked' : ''}> Hecho</label>
        </div>
        <p class="exo-q">${ex.q}</p>
        <button class="btn alt sm" data-ans="${i}">Ver respuesta</button>
        <div class="ans" id="ans${i}" hidden>
          <p class="result">Respuesta: ${ex.a}</p>
          ${ex.s ? `<p class="hint">${ex.s}</p>` : ''}
        </div>
      </div>`;
    }).join('') + `<button class="btn" id="calcBtn">Practicar en la calculadora</button>`
  };
  const tabs = [['teoria', 'Teoría'], ['ejemplos', 'Ejemplos'], ['ejercicios', 'Ejercicios']];
  app.innerHTML = `
    <span class="tag" style="background:${LEVEL_BG[L.level]};color:${LEVEL_COLORS[L.level]}">${L.level}</span>
    <h2 class="ltitle">${L.title}</h2>
    <div class="seg">${tabs.map(([k, n]) => `<button class="${k === lessonTab ? 'on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
    <div>${matHTML(bodies[lessonTab])}</div>
    <div class="nav">
      ${prev ? `<button class="btn alt" data-go="${t.id}/${prev.id}">← Anterior</button>` : '<span></span>'}
      ${next ? `<button class="btn" data-go="${t.id}/${next.id}">Siguiente →</button>` : ''}
    </div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { lessonTab = b.dataset.tab; renderLesson(t, id); });
  app.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
    const el = document.getElementById('ans' + b.dataset.ans);
    el.hidden = !el.hidden;
    b.textContent = el.hidden ? 'Ver respuesta' : 'Ocultar respuesta';
  });
  app.querySelectorAll('[data-done]').forEach(cb => cb.onchange = () => {
    const d = getDone();
    d[cb.dataset.done] = cb.checked;
    setDone(d);
    cb.closest('.exo').classList.toggle('ok', cb.checked);
  });
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { lessonTab = 'teoria'; location.hash = b.dataset.go; });
  const calc = document.getElementById('calcBtn');
  if (calc) calc.onclick = () => location.hash = 'calc';
}

function renderCalc() {
  app.innerHTML = `<div class="panel">
    <p class="hint">Escribe una operación (como 3 + 5) o una ecuación (como 2x + 3 = 7) con el teclado.</p>
    <div id="ed"></div>
    ${stepsToggle()}
    <div id="out"></div></div>`;
  makeEditor(document.getElementById('ed'), text => {
    const out = document.getElementById('out');
    try {
      const r = (text.includes('=') || text.includes('x')) ? solveEquation(text) : evalArit(text);
      out.innerHTML = renderResult(r);
    } catch (e) {
      out.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    }
  });
  bindToggle();
}

function route() {
  const [h, sub] = (location.hash || '#home').slice(1).split('/');
  const t = TOPICS.find(x => x.id === h);
  backBtn.hidden = !h || h === 'home';
  hdrTitle.textContent = t ? t.name : 'Matemáticas Puras';
  if (h === 'calc') renderCalc();
  else if (LESSONS[h] && sub) renderLesson(t, sub);
  else if (LESSONS[h]) renderTopic(t);
  else if (t) renderSoon(t);
  else renderHome();
  window.scrollTo(0, 0);
}
backBtn.onclick = () => {
  const [h, sub] = (location.hash || '#home').slice(1).split('/');
  location.hash = sub ? h : 'home';
};
window.addEventListener('hashchange', route);
route();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
